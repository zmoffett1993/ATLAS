<!doctype html><html lang="en"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS intake — isolated browser checks</title>
<link rel="stylesheet" href="../atlas-routing.css">
<style>body{margin:0;font-family:system-ui;background:#f4f7fa}#fixture-tools{position:fixed;bottom:90px;right:8px;z-index:100;background:#fff8d9;border:1px solid #e4ca86;padding:8px;border-radius:10px;font-size:11px;max-width:220px}#fixture-tools button{min-height:36px;margin:3px}#fixture-results{white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto}.atlas-routing-open #fixture-tools{display:block}</style>
<div id="fixture-tools"><strong>LOCAL TEST · no external services</strong><br><button id="run-checks">Run workflow checks</button><button id="sample">Sample order</button><button id="open-orders">Review orders</button><pre id="fixture-results" role="status"></pre></div>
<script src="../atlas-routing-core.js"></script><script src="../atlas-routing-planner.js"></script><script src="../atlas-routing-storage.js"></script><script src="../atlas-routing-notifications.js"></script><script src="../atlas-routing-intake.js"></script>
<script>
// Real UI/parser/storage validation; entirely synthetic auth, OCR, routes and saves.
// Run from a loopback HTTP server. No credentials or network integrations.
const catalog=[{model:'CGST1-95MM',caseQty:'300',boxesPerPallet:'20',caseDimensions:'17X14X11',caseWeightLb:'31',palletDimensions:'49X44X86',sourceRow:1}];
let actor='11111111-1111-4111-8111-111111111111',mode='clear',photoCalls=0,saves=0,slowResolve;
const records=new Map(), outputs=document.querySelector('#fixture-results');
const settings={truckPalletTarget:11,dailyTripTarget:3,reloadMinutes:40,lunch:'12:00',preserveOrder:false};
window.AtlasAuth={getSession:()=>actor?{user:{id:actor}}:null,displayName:()=> 'Local test administrator',open(){}};
window.atlasRoutingPOD={access:async()=>({capability:'office',canEdit:true}),mount(){},reset(){},hasPending:()=>false};
window.atlasRoutingSavedDays={enabled:true,reset(){},load:async date=>({date,revision:records.get(date)?.revision||0,canEdit:true,document:records.get(date)?.document||{date,version:3,orders:[],catalog,settings,assignments:{},vanConfirmed:{},lockedTrips:[]}}),save:async(date,revision,doc)=>{const validated=atlasRoutingStorage.document(doc);saves++;records.set(date,{document:validated,revision:revision+1});return{revision:revision+1}}};
function page({id='SO-US-999901',cases='12',weak=false}={}){
 const words=[];const at=(text,x,y,w=.05,confidence=.98)=>words.push({text,x,y,w,h:.012,confidence});
 at(id,.6,.10,.2);at('Bill',.1,.2);at('To',.14,.2);at('Ship',.4,.2);at('To',.45,.2);
 at('Unrelated billing note',.1,.22,.2,.1);at('Sample Supply',.4,.22,.2,weak?.3:.98);
 at('123 Example Street',.4,.24,.2);at('Fullerton CA 92835',.4,.26,.2);
 at('Pmt Method',.1,.32,.1);at('COD',.1,.34);at('Item',.1,.4);at('Item',.5,.4,.03);at('Qty',.535,.4,.03);at('Case',.63,.4,.03);at('Qty',.665,.4,.03);
 at('CGST1-95MM-0401',.1,.43,.2);at(String(Number(cases)*300),.508,.442,.04);at(cases,.648,.442,.03);
 return{words,text:words.map(w=>w.text).join('\n')};
}
window.atlasRoutingConnection={available:true,photoAvailable:true,clear(){},readPhoto:async(image,{signal})=>{photoCalls++;if(mode==='slow')await new Promise(resolve=>slowResolve=resolve);if(signal.aborted)throw new DOMException('Canceled','AbortError');return{pages:[page({id:mode==='mixed'?'SO-US-999902':'SO-US-999901',cases:mode==='conflict'?'8':'12',weak:mode==='weak'})]}},showMap:async host=>{host.textContent='Synthetic local map · no Google requests';},drawRoutes:async()=>{}};
// Stable synthetic planner response exercises the real UI without Google calls.
window.atlasRoutingPlanner={...window.atlasRoutingPlanner,planDay:async ({loads,date,onUpdate})=>{
 const start=`${date}T08:00:00-07:00`,end=`${date}T09:00:00-07:00`;
 const trips=loads.map((l,i)=>({...l,tripIndex:i,departure:start,returnTime:end,driveSeconds:1800,distanceMeters:16093.44,visits:l.shipments.map((_,stopIndex)=>({stopIndex,arrival:start})),locations:l.shipments.map(()=>({formattedAddress:'123 Example Street, Fullerton CA 92835',location:{latitude:33.87,longitude:-117.92}}))}));
 const plan={complete:true,warnings:[],unscheduled:[],trips,driveSeconds:1800,distanceMeters:16093.44,drivers:{Bubba:{trips:trips.length,utilizationPercent:13,workMinutes:60},Achmad:{trips:0}}};onUpdate(plan);return plan;
}};
window.addEventListener('error',e=>outputs.textContent+='\nERROR: '+e.message);
window.addEventListener('unhandledrejection',e=>outputs.textContent+='\nERROR: '+e.reason?.message);
</script><script src="../atlas-routing.js"></script>
<script>
const wait=async predicate=>{for(let i=0;i<100;i++){if(predicate())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out waiting for UI');};
const screen=()=>document.querySelector('[data-intake-screen]')?.dataset.intakeScreen;
const click=selector=>{const el=document.querySelector(selector);if(!el||el.disabled)throw Error('Unavailable '+selector);el.click();};
const act=name=>click(`[data-intake-action="${name}"]`);
async function photo(){const canvas=document.createElement('canvas');canvas.width=600;canvas.height=700;const c=canvas.getContext('2d');c.fillStyle='white';c.fillRect(0,0,600,700);c.fillStyle='#071b33';c.font='24px sans-serif';['SYNTHETIC TEST ORDER','SO-US-999901','Sample Supply','123 Example Street','Fullerton CA 92835','CGST1-95MM-0401','Case Qty: 12 boxes','Item Qty: 3,600 units','NOT A REAL DELIVERY'].forEach((t,i)=>c.fillText(t,35,60+i*65));const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const transfer=new DataTransfer();transfer.items.add(new File([blob],'synthetic-order.png',{type:'image/png'}));const input=document.querySelector('[data-intake-files]');input.files=transfer.files;input.dispatchEvent(new Event('change'));await wait(()=>screen()==='VERIFY');}
document.querySelector('#sample').onclick=async()=>{click('[data-route-intake]');await photo();};
document.querySelector('#open-orders').onclick=()=>click('[data-manager-tab="orders"]');
document.querySelector('#run-checks').onclick=async()=>{
 let count=0;outputs.textContent='Running…';const check=(yes,label)=>{if(!yes)throw Error(label);outputs.textContent+=`\nPASS ${++count}: ${label}`;};
 try{
  click('[data-route-intake]');check(screen()==='ADD_DOCUMENT','Add Document opens with no manual-entry action');check(!document.querySelector('.atlas-document-flow').textContent.includes('Enter Manually'),'Manual editor is outside intake');
  mode='weak';await photo();check(document.querySelector('[data-intake-action="add"]').disabled,'Unclear customer requires confirmation');
  click('[data-intake-confirm="customer"]');check(!document.querySelector('[data-intake-action="add"]').disabled,'One field confirmed; unrelated notes do not block');
  act('append');mode='clear';await photo();check(document.querySelectorAll('[data-intake-field^="sku."]').length===1,'Repeated paperwork does not duplicate SKU rows');
  act('append');mode='conflict';await photo();check(document.querySelector('[data-intake-action="add"]').disabled,'New conflicting box counts still block');
  click('[data-intake-remove-page="2"]');await wait(()=>screen()==='VERIFY');check(!document.querySelector('[data-intake-action="add"]').disabled,'Removing conflicting page preserves confirmed order');
  act('append');mode='mixed';await photo();check(document.querySelector('[data-intake-action="add"]').disabled,'Different sales orders cannot merge');
  click('[data-intake-remove-page="2"]');await wait(()=>screen()==='VERIFY');act('add');await wait(()=>screen()==='ORDER_ADDED');check(document.querySelector('[data-route-total-orders]').textContent==='1','Explicit Add creates exactly one order');check(saves===0,'Review does not silently save');
  act('another');mode='clear';await photo();act('add');await wait(()=>document.querySelector('.atlas-document-error[role=alert]')?.textContent.includes('already'));check(document.querySelector('[data-route-total-orders]').textContent==='1','Duplicate sales order is rejected');
  act('back');await wait(()=>!document.querySelector('.atlas-document-flow').open);await new Promise(r=>setTimeout(r,40));click('[data-manager-tab="orders"]');act('optimize');await wait(()=>screen()==='ROUTE_READY');check(document.querySelector('.atlas-document-trip')?.textContent.includes('Sample Supply'),'Route Ready uses actual planner callback');
  act('save');await wait(()=>screen()==='SAVED');check(saves===1,'Save Route uses existing saved-day connection');check(!JSON.stringify([...records.values()]).includes('blob:'),'Saved record contains no photos');
  act('back');act('back');await wait(()=>!document.querySelector('.atlas-document-flow').open);await new Promise(r=>setTimeout(r,40));click('[data-route-intake]');mode='slow';const pending=photo();await wait(()=>screen()==='READING');actor=null;window.dispatchEvent(new CustomEvent('atlas-auth-changed',{detail:{session:null}}));slowResolve();await pending.catch(()=>{});check(!document.querySelector('.atlas-document-flow').open,'Sign-out closes intake and rejects late reading');
  actor='11111111-1111-4111-8111-111111111111';mode='clear';await atlasOpenRouting();await wait(()=>!document.querySelector('#atlasDeliveryRouting').inert);outputs.textContent+=`\n${count} CHECKS PASSED · no external requests`;
 }catch(e){outputs.textContent+='\nFAIL: '+e.message;}
};
atlasOpenRouting();
</script></html>
