  act('add');await wait(()=>screen()==='ORDER_ADDED');
  const saved=[...records.values()].flatMap(r=>r.document.orders).find(o=>o.orderNumber==='SO-US-68159');
  check(JSON.stringify(saved?.lines)==='[{"sku":"CGUB1-60MLV3-BK","caseQty":120,"itemQty":60000}]','Uploaded order preserves the exact SKU, boxes and units for planning');
  outputs.textContent+=`\n${count} CASE QTY REVIEW CHECKS PASSED · no external requests`;
 }catch(e){outputs.textContent+='\nFAIL: '+e.message;}
}

async function checkRefresh() {
 let count=0;outputs.textContent='Routing refresh checks';
 const check=(yes,label)=>{if(!yes)throw Error(label);outputs.textContent+='\nPASS '+(++count)+': '+label;};
 const originalSave=atlasRoutingSavedDays.save;
 const date=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
 const order={id:'22222222-2222-4222-8222-222222999905',orderNumber:'SO-US-999905',customer:'Synthetic Refresh Customer',address:'123 Example Street, Fullerton CA 92835',city:'Fullerton',timeWindow:'8:00 AM–2:00 PM',serviceMinutes:25,notes:'TEST DELIVERY',checkOnDelivery:true,invoiceNumbers:[],fulfillmentNumbers:[],lines:[{sku:'CGST1-95MM-0401',caseQty:100,itemQty:30000}]};
 const load=async()=>{records.set(date,{revision:1,document:{date,version:3,orders:[order],catalog,settings,assignments:{},vanConfirmed:{},lockedTrips:[]}});const input=document.querySelector('[data-route-date]');input.value=date;input.dispatchEvent(new Event('change'));await wait(()=>!document.querySelector('.atlas-route-main').inert&&document.querySelector('[data-route-orders]').textContent.includes(order.customer));};
 try {
  await atlasOpenRouting();await load();
  check(!document.querySelector('.atlas-document-flow').open,'Default routing opens the dashboard');
  check(document.querySelectorAll('[data-route-optimize]').length===1&&!document.querySelector('[data-route-manual-order]'),'One dashboard optimizer; no manual entry shortcut');
  check(document.querySelector('.atlas-dispatch-tabs [data-route-history]').textContent.includes('Previous Trips'),'Previous Trips label retains history action');
  check(document.querySelector('[data-route-orders]').textContent.includes('CHECK ON DELIVERY'),'Check-on-delivery is preserved');
  click('[data-route-orders] .atlas-route-order-actions [data-route-edit]');
  check(document.querySelector('[name="customer"]').value===order.customer&&document.querySelector('[data-line-cases]').value==='100','Edit retains customer, SKU and boxes');
  click('[data-route-cancel]');
  click('[data-route-orders] [data-route-delete]');
  check(document.querySelector('[data-route-delete-dialog]').textContent.includes(order.orderNumber),'Delete dialog names exact order');
  atlasRoutingSavedDays.save=async()=>{throw Error('Synthetic save failure');};
  click('[data-route-delete-confirm]');await wait(()=>document.querySelector('[data-route-delete-error]').textContent.includes('Nothing was changed'));
  check(document.querySelector('[data-route-total-orders]').textContent==='1'&&records.get(date).document.orders.length===1,'Failed save restores order and saved state');
  atlasRoutingSavedDays.save=originalSave;click('[data-route-delete-confirm]');await wait(()=>!document.querySelector('[data-route-delete-dialog]').open);
  check(document.querySelector('[data-route-total-orders]').textContent==='0'&&records.get(date).document.orders.length===0,'Successful deletion saves and recalculates empty day');
  check(document.querySelector('[data-route-optimize]').disabled,'Empty day cannot optimize');
  await load();click('[data-route-lock-next]');await wait(()=>records.get(date).document.lockedTrips.length===1);
  click('[data-route-orders] [data-route-delete]');
  check(!document.querySelector('[data-route-delete-confirm]')&&document.querySelector('[data-route-delete-dialog]').textContent.includes('sent-out'),'Sent-out order cannot be deleted');
  click('[data-route-delete-cancel]');
  const locked=JSON.stringify(records.get(date).document.lockedTrips);check(locked.includes(order.id),'Locked trip snapshot remains intact');
  outputs.textContent+='\n'+count+' REFRESH CHECKS PASSED · no external requests';
 }catch(e){outputs.textContent+='\nFAIL: '+e.message;}finally{atlasRoutingSavedDays.save=originalSave;}
}
document.querySelector('#refresh-checks').onclick=checkRefresh;

const entryCheck=new URLSearchParams(location.search).get('entryCheck');
if(entryCheck)checkDirectEntry(entryCheck);else atlasOpenRouting().then(()=>{if(scannerEnabled&&!new URLSearchParams(location.search).has('refresh'))click('[data-route-intake]');});
if(new URLSearchParams(location.search).has('caseFixture'))checkCaseQtyReview(new URLSearchParams(location.search).get('caseFixture'));
if(new URLSearchParams(location.search).has('scannerRun'))wait(()=>document.querySelector('.is-scanner[open]')).then(()=>document.querySelector('#scanner-checks').click());
if(new URLSearchParams(location.search).has('scannerSample'))wait(()=>document.querySelector('.is-scanner[open]')).then(()=>document.querySelector('#scanner-sample').click());
if(new URLSearchParams(location.search).has('refresh'))atlasOpenRouting().then(checkRefresh);
if(new URLSearchParams(location.search).has('example'))wait(()=>document.querySelector('[data-route-mobile-date]')&&!document.querySelector('#atlasDeliveryRouting').inert).then(()=>document.querySelector('#dashboard-example').click());
</script></html>
