<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071f43">
  <title>ATLAS COC Receiver</title>
  <link rel="icon" type="image/svg+xml" href="./coc-receiver-favicon.svg?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="./coc-receiver-favicon-16.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="./coc-receiver-favicon-32.png?v=4">
  <link rel="stylesheet" href="./receiver.css?v=40">
  <link rel="stylesheet" href="../atlas-auth.css?v=4">
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const refreshKey = "atlas-coc-receiver-v391-refreshed";
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        // Apply background updates on the next page load, without interrupting office work.
        if (!document.querySelector(".receiver-startup")) return;
        if (refreshing || sessionStorage.getItem(refreshKey)) return;
        refreshing = true;
        sessionStorage.setItem(refreshKey, "1");
        window.location.reload();
      });
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            "../atlas-routing-worker.mjs?v=281",
            { type: "module", updateViaCache: "none" },
          );
          const activate = (worker) => worker?.postMessage({ type: "SKIP_WAITING" });
          activate(registration.waiting);
          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            worker?.addEventListener("statechange", () => {
              if (worker.state === "installed") activate(worker);
            });
          });
          await registration.update();
        } catch {
          // The Receiver remains usable online if service-worker refresh is unavailable.
        }
      });
    })();
  </script>
</head>
<body>
  <main id="receiver-root" aria-live="polite">
    <section class="receiver-startup" role="status" aria-busy="true" aria-label="Restoring COC Receiver">
      <img src="../atlas-brand-mark-dark.svg?v=97" alt="ATLAS">
      <span>RESTORING COC RECEIVER</span>
      <div class="receiver-startup-line" aria-hidden="true"></div>
    </section>
  </main>
