  <title>ATLAS COC Receiver</title>
  <link rel="icon" type="image/png" sizes="16x16" href="./coc-receiver-favicon-16.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="./coc-receiver-favicon-32.png?v=3">
  <link rel="stylesheet" href="./receiver.css?v=37">
  <link rel="stylesheet" href="../atlas-auth.css?v=3">
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const refreshKey = "atlas-coc-receiver-v331-refreshed";
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing || sessionStorage.getItem(refreshKey)) return;
        refreshing = true;
        sessionStorage.setItem(refreshKey, "1");
        window.location.reload();
      });
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            "../service-worker.js?v=260",
            { updateViaCache: "none" },
          );
          const activate = (worker) => worker?.postMessage({ type: "SKIP_WAITING" });
          activate(registration.waiting);
          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            worker?.addEventListener("statechange", () => {
              if (worker.state === "installed") activate(worker);
            });
          });
          await registration.update();
        } catch {
          // The Receiver remains usable online if service-worker refresh is unavailable.
        }
      });
    })();
  </script>
