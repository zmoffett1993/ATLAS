<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163b5c">
<meta name="description" content="ATLAS warehouse SKU location system for fast, accurate order picking.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS · Warehouse Location System</title>
<style>
:root{--bg:#edf3f7;--panel:#fff;--ink:#102438;--muted:#607387;--brand:#163b5c;--brand2:#246c9d;--brand-soft:#e8f2f8;--green:#18864b;--green-soft:#e6f6ec;--yellow:#9b6a00;--yellow-soft:#fff3cd;--red:#b42318;--red-soft:#fee4e2;--line:#d8e1e8;--shadow:0 12px 30px rgba(20,45,70,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{min-height:100vh}.hidden{display:none!important}
.topbar{background:linear-gradient(135deg,var(--brand),#0d2941);color:#fff;padding:18px 18px 22px;position:sticky;top:0;z-index:10;box-shadow:0 8px 20px rgba(0,0,0,.18)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.atlas-mark{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:1000;letter-spacing:.8px;box-shadow:0 8px 20px rgba(0,0,0,.2)}.brand-copy h1{font-size:22px;margin:0;letter-spacing:.6px}.brand-copy p{margin:4px 0 0;color:#cfe3f4;font-size:13px}.status{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;background:#dce7ef;color:#24445f;white-space:nowrap}.status.live{background:#d9f4e3;color:#126638}.status.error{background:var(--red-soft);color:var(--red)}
.search-wrap{max-width:980px;margin:16px auto 0;position:relative}.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#718497;font-size:18px;pointer-events:none}.search{width:100%;border:0;border-radius:14px;padding:16px 48px 16px 46px;font-size:17px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 5px 15px rgba(0,0,0,.15)}.search:focus{box-shadow:0 0 0 3px rgba(91,170,224,.42),0 5px 15px rgba(0,0,0,.15)}.clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:#e7eef4;color:#24445f;width:30px;height:30px;border-radius:50%;cursor:pointer;display:none;font-size:20px;line-height:1}.suggestions{position:absolute;left:0;right:0;top:58px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:310px;overflow-y:auto;display:none;z-index:20}.suggestion{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:850}.suggestion:last-child{border-bottom:0}.suggestion small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.suggestion:hover,.suggestion:focus{background:#edf6fc;outline:none}
.tabs{max-width:980px;margin:18px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}.tab{border:0;background:#dce7ef;color:#24445f;padding:12px;border-radius:11px;font-weight:800;cursor:pointer}.tab.active{background:var(--brand2);color:#fff}main{max-width:980px;margin:auto;padding:16px 16px 36px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--panel);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center}.stat strong{display:block;font-size:22px;color:var(--brand)}.stat span{font-size:12px;color:var(--muted)}
.empty{background:var(--panel);border:2px dashed #c6d4df;border-radius:18px;padding:38px 22px;text-align:center;color:var(--muted)}.empty .icon{font-size:36px;margin-bottom:8px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.not-found{border-color:#efb6b1;background:#fffafa}.not-found strong{color:var(--red)}
.result-card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}.result-head{background:linear-gradient(135deg,#f7fafc,#e7f1f7);padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.sku-copy{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);cursor:pointer;min-width:0}.sku-copy .sku{font-size:20px;font-weight:950;word-break:break-word}.sku-copy .copy-hint{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-top:5px}.location-count{flex:0 0 auto;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:var(--green-soft);color:var(--green)}.location-count.multiple{background:var(--yellow-soft);color:var(--yellow)}
.primary-label{padding:12px 18px 0;color:var(--brand2);font-size:12px;font-weight:950;letter-spacing:.7px}.location-card{padding:13px 18px 18px;display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:center}.pin{width:112px;height:112px;border-radius:27px;background:linear-gradient(145deg,var(--brand2),#174f77);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 11px 24px rgba(36,108,157,.28);animation:resultPop .22s ease-out}.pin .loc{font-size:38px;font-weight:1000;letter-spacing:-1px}.pin .label{font-size:10px;font-weight:900;letter-spacing:1px;opacity:.85}.location-info h2{margin:0 0 6px;font-size:21px}.location-info p{margin:4px 0;color:var(--muted);font-size:14px}.coverage{display:inline-block;margin-top:8px;background:var(--green-soft);color:var(--green);font-weight:850;font-size:12px;border-radius:999px;padding:6px 9px}.notes{margin-top:8px;font-size:13px;color:var(--muted)}
.aisle-guide{padding:16px 18px 18px;border-top:1px solid var(--line);background:#fbfcfd}.aisle-guide-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}.aisle-guide-title span{font-size:12px;color:var(--muted)}.aisle-diagram{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.aisle-section-marker{min-height:54px;border:2px solid #b9c9d6;background:#e9f2f7;border-radius:11px;padding:8px 6px;font-weight:950;color:#24445f;display:grid;place-items:center;text-align:center}.aisle-section-marker.active{background:var(--brand2);border-color:var(--brand2);color:#fff;box-shadow:0 7px 16px rgba(36,108,157,.22)}.aisle-section-marker small{display:block;font-size:10px;font-weight:700;opacity:.8;margin-top:2px}.map-star{font-size:17px;color:#ffd166;margin-left:3px}
.overflow-title{padding:13px 18px;background:#f7f9fb;border-top:1px solid var(--line);font-weight:950}.overflow-list{padding:0 18px 18px}.overflow-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.overflow-item:last-child{border-bottom:0}.small-loc{background:#edf1f4;color:#44586c;font-weight:950;border-radius:9px;padding:8px 11px;white-space:nowrap}
.recents{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-top:16px}.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-title-row h2{margin:0;font-size:17px}.clear-recents{border:0;background:transparent;color:var(--brand2);font-size:12px;font-weight:900;cursor:pointer;padding:7px}.recent-list{display:grid;gap:8px}.recent-item{width:100%;border:1px solid var(--line);background:#f8fafb;color:var(--ink);border-radius:11px;padding:11px 12px;text-align:left;font-size:13px;font-weight:850;cursor:pointer;word-break:break-word}.recent-item:hover{background:var(--brand-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#102438;color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.2s ease;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
.aisle-tab-bar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.aisle-select-tab{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;min-width:76px}.aisle-select-tab.active{background:var(--brand);border-color:var(--brand);color:#fff}.aisle-card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.aisle-title{background:var(--brand);color:#fff;padding:13px 15px;font-weight:900;display:flex;justify-content:space-between}.section{padding:12px 15px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-loc{font-size:18px;font-weight:900;color:var(--brand2)}.section-count{font-size:12px;color:var(--muted)}.sku-chip{display:block;width:100%;border:0;text-align:left;background:#f4f7f9;border-radius:8px;padding:9px 10px;margin:6px 0;font-size:12px;font-weight:750;word-break:break-word;cursor:pointer}.sku-chip:hover{background:#e7f1f7}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
@keyframes resultPop{from{transform:scale(.94);opacity:.55}to{transform:scale(1);opacity:1}}
@media(max-width:620px){.brand-copy h1{font-size:19px}.brand-copy p{font-size:12px}.atlas-mark{width:42px;height:42px}.summary{grid-template-columns:repeat(3,1fr)}.stat{padding:10px 5px}.stat strong{font-size:18px}.location-card{grid-template-columns:94px 1fr;gap:14px}.pin{width:90px;height:90px;border-radius:23px}.pin .loc{font-size:31px}.location-info h2{font-size:18px}.result-head{display:block}.location-count{display:inline-block;margin-top:9px}.aisle-diagram{gap:5px}.aisle-section-marker{min-height:49px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand-row"><div class="brand"><div class="atlas-mark" aria-hidden="true">ATLAS</div><div class="brand-copy"><h1>ATLAS</h1><p>Warehouse Location System · Sprint 2</p></div></div><div id="connectionStatus" class="status" role="status" aria-live="polite">CONNECTING…</div></div>
  <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" class="search" autocomplete="off" placeholder="Search by SKU..." aria-label="Search warehouse SKU" inputmode="search" enterkeyhint="search" spellcheck="false"><button id="clear" class="clear" type="button" aria-label="Clear search">×</button><div id="suggestions" class="suggestions" role="listbox"></div></div>
</header>
<div class="tabs"><button class="tab active" type="button" data-view="searchView" aria-controls="searchView">SKU Search</button><button class="tab" type="button" data-view="aisleView" aria-controls="aisleView">Browse Aisles</button></div>
<main>
  <div class="summary"><div class="stat"><strong id="skuCount">—</strong><span>Unique SKUs</span></div><div class="stat"><strong id="locationCount">—</strong><span>SKU Locations</span></div><div class="stat"><strong id="aisleCount">—</strong><span>Aisles Loaded</span></div></div>
  <section id="searchView" aria-label="SKU search results"><div id="emptyState" class="empty"><div class="icon">🔎</div><strong>Search for a product SKU</strong><div>Tap the search box to begin.</div></div><div id="results"></div><section id="recents" class="recents hidden" aria-label="Recent searches"><div class="section-title-row"><h2>Recent Searches</h2><button id="clearRecents" class="clear-recents" type="button">Clear Recents</button></div><div id="recentList" class="recent-list"></div></section></section>
  <section id="aisleView" class="hidden" aria-label="Browse warehouse aisles"><div id="aisles"></div></section>
  <div class="footer-note">ATLAS · Sprint 2 Picker Speed · Live Supabase database · Simplified A–D layout</div>
</main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite">SKU copied</div>
<script>
'use strict';
const SUPABASE_URL='https://dwrrbpiprcmajfyronlf.supabase.co';
const SUPABASE_KEY='sb_publishable_akr0opK3RV0Mg5CQpF2woQ_hBFyRIJa';
const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
const RECENTS_KEY='atlas_recent_skus_v1';
const MAX_RECENTS=5;
let skuData=[];
let locationRows=[];
let recentSkus=loadRecents();
let toastTimer;

const $=id=>document.getElementById(id);
const search=$('search'),clearBtn=$('clear'),suggestions=$('suggestions'),results=$('results'),emptyState=$('emptyState');
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const normalize=value=>String(value??'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9-]/g,'');
function strictSkuMatch(sku,query){const source=normalize(sku),q=normalize(query);if(!q)return false;let start=0;while(true){const index=source.indexOf(q,start);if(index===-1)return false;const before=index>0?source[index-1]:'';const after=index+q.length<source.length?source[index+q.length]:'';const validStart=!/^\d/.test(q)||!/[0-9]/.test(before);const validEnd=!/^\d+$/.test(q)||!/[0-9]/.test(after);if(validStart&&validEnd)return true;start=index+1;}}

function loadRecents(){try{const stored=JSON.parse(localStorage.getItem(RECENTS_KEY)||'[]');return Array.isArray(stored)?stored.slice(0,MAX_RECENTS):[];}catch{return [];}}
function saveRecents(){localStorage.setItem(RECENTS_KEY,JSON.stringify(recentSkus));}
function addRecent(sku){recentSkus=[sku,...recentSkus.filter(item=>item!==sku)].slice(0,MAX_RECENTS);saveRecents();renderRecents();}
function renderRecents(){const section=$('recents'),list=$('recentList');if(!recentSkus.length){section.classList.add('hidden');list.innerHTML='';return;}section.classList.remove('hidden');list.innerHTML=recentSkus.map(sku=>`<button class="recent-item" type="button" data-sku="${escapeHtml(sku)}">${escapeHtml(sku)}</button>`).join('');list.querySelectorAll('.recent-item').forEach(button=>button.addEventListener('click',()=>selectSku(button.dataset.sku)));}

async function fetchAll(table,select='*'){
  const pageSize=1000;let offset=0,all=[];
  while(true){
    const url=`${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(select)}&order=created_at.asc&limit=${pageSize}&offset=${offset}`;
    const response=await fetch(url,{headers});
    if(!response.ok)throw new Error(`${table}: ${response.status} ${await response.text()}`);
    const page=await response.json();all=all.concat(page);if(page.length<pageSize)return all;offset+=pageSize;
  }
}

async function loadData(){
  try{
    $('connectionStatus').textContent='CONNECTING…';$('connectionStatus').className='status';
    const [skus,locations]=await Promise.all([fetchAll('skus','id,sku,description,active'),fetchAll('locations','id,sku_id,aisle,section,level_info,notes,verified')]);
    const skuById=new Map(skus.filter(s=>s.active!==false).map(s=>[s.id,s]));
    locationRows=locations.filter(l=>skuById.has(l.sku_id)).map(l=>({...l,sku:skuById.get(l.sku_id).sku}));
    skuData=[...skuById.values()].map(s=>({id:s.id,sku:s.sku,description:s.description||'',locations:locationRows.filter(l=>l.sku_id===s.id).sort((a,b)=>Number(a.aisle)-Number(b.aisle)||String(a.section).localeCompare(String(b.section)))})).sort((a,b)=>a.sku.localeCompare(b.sku));
    $('skuCount').textContent=skuData.length;$('locationCount').textContent=locationRows.length;$('aisleCount').textContent=new Set(locationRows.map(l=>l.aisle)).size;
    $('connectionStatus').textContent='LIVE';$('connectionStatus').className='status live';
    renderAisles();renderRecents();
  }catch(error){
    console.error(error);$('connectionStatus').textContent='CONNECTION ERROR';$('connectionStatus').className='status error';
    emptyState.innerHTML=`<div class="icon">⚠️</div><strong>Could not load warehouse data</strong><div style="margin-top:8px">${escapeHtml(error.message)}</div>`;
  }
}

function showSuggestions(query){
  if(!normalize(query)){suggestions.style.display='none';suggestions.innerHTML='';return;}
  const matches=skuData.filter(item=>strictSkuMatch(item.sku,query)).slice(0,12);
  suggestions.innerHTML=matches.map(item=>`<div class="suggestion" role="option" tabindex="0" data-sku="${escapeHtml(item.sku)}">${escapeHtml(item.sku)}<small>${item.locations.length} location${item.locations.length===1?'':'s'}${item.locations[0]?` · ${escapeHtml(locationLabel(item.locations[0]))}`:''}</small></div>`).join('');
  suggestions.style.display=matches.length?'block':'none';
  suggestions.querySelectorAll('.suggestion').forEach(element=>{element.addEventListener('click',()=>selectSku(element.dataset.sku));element.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectSku(element.dataset.sku);}});});
}

function isBackWall(section){return ['BACK WALL STORAGE','BACK WALL','BWS','REAR WALL STORAGE','REAR WALL','RWS'].includes(String(section??'').toUpperCase());}
function locationLabel(location){return isBackWall(location.section)?'BACK WALL':`${location.aisle}${location.section}`;}
function locationTitle(location){return isBackWall(location.section)?`Aisle ${location.aisle} · Back Wall Storage`:`Aisle ${location.aisle} · Section ${location.section}`;}
function buildAisleGuide(location){if(isBackWall(location.section))return '';const active=String(location.section??'').toUpperCase();return `<div class="aisle-guide"><div class="aisle-guide-title"><strong>Aisle ${escapeHtml(location.aisle)} section overview</strong><span>Highlighted: ${escapeHtml(active)}</span></div><div class="aisle-diagram">${['A','B','C','D'].map(letter=>`<div class="aisle-section-marker ${letter===active?'active':''}"><div>SECTION ${letter}${letter===active?'<span class="map-star">★</span>':''}<small>${letter===active?'Selected':''}</small></div></div>`).join('')}</div></div>`;}

function showToast(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1200);}
async function copySku(sku){try{await navigator.clipboard.writeText(sku);showToast('✓ SKU copied');}catch{const area=document.createElement('textarea');area.value=sku;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();showToast('✓ SKU copied');}}

function renderResult(item){
  if(!item){emptyState.classList.remove('hidden');emptyState.classList.remove('not-found');emptyState.innerHTML='<div class="icon">🔎</div><strong>Search for a product SKU</strong><div>Tap the search box to begin.</div>';results.innerHTML='';return;}
  emptyState.classList.add('hidden');
  if(!item.locations.length){results.innerHTML=`<article class="result-card"><div class="result-head"><button class="sku-copy" type="button" data-copy-sku="${escapeHtml(item.sku)}"><span class="sku">${escapeHtml(item.sku)}</span><span class="copy-hint">Tap SKU to copy</span></button><span class="location-count">0 LOCATIONS</span></div><div class="empty not-found" style="margin:18px"><strong>No location assigned</strong><div>This SKU exists but needs a warehouse location.</div></div></article>`;bindCopyButtons();return;}
  const [primary,...overflow]=item.locations;
  results.innerHTML=`<article class="result-card"><div class="result-head"><button class="sku-copy" type="button" data-copy-sku="${escapeHtml(item.sku)}"><span class="sku">${escapeHtml(item.sku)}</span><span class="copy-hint">Tap SKU to copy</span></button><span class="location-count ${item.locations.length>1?'multiple':''}">${item.locations.length} LOCATION${item.locations.length===1?'':'S'}</span></div><div class="primary-label">PRIMARY PICK LOCATION</div><div class="location-card"><div class="pin"><span class="label">LOCATION</span><span class="loc">${escapeHtml(locationLabel(primary))}</span></div><div class="location-info"><h2>${escapeHtml(locationTitle(primary))}</h2><p>${escapeHtml(primary.verified?'Verified location':'Needs verification')}</p><span class="coverage">${escapeHtml(primary.level_info||'Multiple Levels')}</span>${primary.notes?`<div class="notes">${escapeHtml(primary.notes)}</div>`:''}</div></div>${buildAisleGuide(primary)}${overflow.length?`<div class="overflow-title">Overflow Locations</div><div class="overflow-list">${overflow.map(loc=>`<div class="overflow-item"><div><strong>${escapeHtml(locationTitle(loc))}</strong><div class="notes">${escapeHtml(loc.level_info||'Multiple Levels')}</div></div><span class="small-loc">${escapeHtml(locationLabel(loc))}</span></div>`).join('')}</div>`:''}</article>`;
  bindCopyButtons();
}
function bindCopyButtons(){results.querySelectorAll('[data-copy-sku]').forEach(button=>button.addEventListener('click',()=>copySku(button.dataset.copySku)));}
function showNotFound(query){results.innerHTML='';emptyState.classList.remove('hidden');emptyState.classList.add('not-found');emptyState.innerHTML=`<div class="icon">⚠️</div><strong>SKU not found</strong><div>No match for “${escapeHtml(query)}”.</div>`;}

function selectSku(sku){const item=skuData.find(x=>x.sku===sku);if(!item)return;search.value=sku;clearBtn.style.display='block';suggestions.style.display='none';renderResult(item);addRecent(item.sku);document.querySelector('[data-view="searchView"]').click();search.blur();window.scrollTo({top:0,behavior:'smooth'});}
function runSearch(){const query=search.value;clearBtn.style.display=query?'block':'none';showSuggestions(query);const exact=skuData.find(item=>normalize(item.sku)===normalize(query));if(exact)renderResult(exact);else if(!query)renderResult(null);else{emptyState.classList.add('hidden');results.innerHTML='';}}

function renderAisles(){
  const aisleNumbers=[...new Set(locationRows.map(l=>Number(l.aisle)))].sort((a,b)=>a-b);const container=$('aisles');
  if(!aisleNumbers.length){container.innerHTML='<div class="empty">No locations loaded.</div>';return;}
  container.innerHTML=`<div class="aisle-tab-bar">${aisleNumbers.map((aisle,index)=>`<button class="aisle-select-tab ${index===0?'active':''}" type="button" data-aisle="${aisle}">Aisle ${aisle}</button>`).join('')}</div><div id="aisleContent"></div>`;
  const showAisle=aisle=>{container.querySelectorAll('.aisle-select-tab').forEach(button=>button.classList.toggle('active',Number(button.dataset.aisle)===aisle));const bySection={A:[],B:[],C:[],D:[]};locationRows.filter(l=>Number(l.aisle)===aisle).forEach(l=>{if(bySection[l.section])bySection[l.section].push(l);});$('aisleContent').innerHTML=`<div class="aisle-card"><div class="aisle-title"><span>AISLE ${aisle}</span><span>Sections A–D</span></div>${['A','B','C','D'].map(section=>{const rows=bySection[section].sort((a,b)=>a.sku.localeCompare(b.sku));return `<div class="section"><div class="section-head"><span class="section-loc">Section ${section}</span><span class="section-count">${rows.length} SKU${rows.length===1?'':'s'}</span></div>${rows.length?rows.map(row=>`<button class="sku-chip" type="button" data-sku="${escapeHtml(row.sku)}">${escapeHtml(row.sku)}</button>`).join(''):'<div class="notes">No SKUs assigned</div>'}</div>`;}).join('')}</div>`;$('aisleContent').querySelectorAll('.sku-chip').forEach(button=>button.addEventListener('click',()=>selectSku(button.dataset.sku)));};
  container.querySelectorAll('.aisle-select-tab').forEach(button=>button.addEventListener('click',()=>showAisle(Number(button.dataset.aisle))));showAisle(aisleNumbers[0]);
}

search.addEventListener('input',runSearch);
search.addEventListener('focus',()=>{if(search.value)showSuggestions(search.value);});
search.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();const exact=skuData.find(item=>normalize(item.sku)===normalize(search.value));const first=exact||skuData.find(item=>strictSkuMatch(item.sku,search.value));if(first)selectSku(first.sku);else if(search.value.trim()){suggestions.style.display='none';showNotFound(search.value.trim());search.blur();}}});
clearBtn.addEventListener('mousedown',event=>event.preventDefault());
clearBtn.addEventListener('click',()=>{search.value='';clearBtn.style.display='none';suggestions.style.display='none';renderResult(null);search.blur();});
$('clearRecents').addEventListener('click',()=>{recentSkus=[];saveRecents();renderRecents();showToast('Recents cleared');});
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))suggestions.style.display='none';});
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');['searchView','aisleView'].forEach(id=>$(id).classList.toggle('hidden',id!==tab.dataset.view));search.blur();suggestions.style.display='none';}));
renderRecents();loadData();
</script>
</body>
</html>
