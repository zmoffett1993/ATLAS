<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071b34">
<meta name="description" content="ATLAS warehouse SKU finder for Chubby Gorilla.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS · Warehouse SKU Finder</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app">
  <div class="screen">
    <header class="brand-header">
      <div class="brand-inner">
        <div class="brand-top">
          <button id="menuButton" class="menu-button" type="button" aria-label="Open menu"><span></span></button>
          <div class="cg-lockup"><div class="gorilla-mark">CG</div><div class="cg-name">CHUBBY<br>GORILLA®</div></div>
          <div id="connectionStatus" class="connection">CONNECTING</div>
        </div>
        <div class="brand-title"><h1>ATLAS</h1><p>WAREHOUSE SKU FINDER</p><div class="tagline">Find any SKU in seconds.</div></div>
      </div>
    </header>

    <main class="workspace">
      <section id="homeView">
        <div class="search-panel">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input id="search" class="search" autocomplete="off" placeholder="Search SKU or scan barcode..." aria-label="Search SKU">
            <button id="clear" class="clear" type="button" aria-label="Clear search">×</button>
            <div id="suggestions" class="suggestions" role="listbox"></div>
          </div>
          <button id="browseShortcut" class="quick-link" type="button"><span class="quick-icon">▦</span><span class="quick-copy"><strong>Browse Aisles</strong><span>View warehouse layout by aisle.</span></span><span class="chevron">›</span></button>
        </div>

        <section id="resultsArea" class="hidden" style="margin-top:18px"><div id="results"></div></section>
        <section id="emptyArea" class="hidden" style="margin-top:18px"><div id="emptyState" class="empty"></div></section>

        <section id="recentsSection" class="hidden">
          <div class="section-heading"><h2>RECENT SEARCHES</h2><button id="clearRecents" class="link-button" type="button">Clear Recents</button></div>
          <div id="recentList" class="recent-list"></div>
        </section>
      </section>

      <section id="aisleView" class="hidden">
        <h2 class="page-title">BROWSE AISLES</h2><p class="page-subtitle">Select an aisle to view its warehouse layout.</p>
        <div id="aisleGrid" class="aisle-grid"></div><div id="aisles" class="aisle-browser"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Primary navigation"><div class="bottom-nav-inner">
    <button class="nav-button active" type="button" data-view="homeView"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="nav-button" type="button" data-view="aisleView"><span class="nav-icon">▦</span><span>Browse Aisles</span></button>
  </div></nav>

  <div id="drawerBackdrop" class="drawer-backdrop"><aside class="drawer" aria-label="Application menu"><div class="drawer-head"><div class="cg-lockup"><div class="gorilla-mark">CG</div><div class="cg-name">CHUBBY<br>GORILLA®</div></div><button id="drawerClose" class="drawer-close" type="button" aria-label="Close menu">×</button></div><button class="drawer-link" type="button" data-drawer-view="homeView">⌂ &nbsp; Home</button><button class="drawer-link" type="button" data-drawer-view="aisleView">▦ &nbsp; Browse Aisles</button><button class="drawer-link" type="button" id="aboutButton">ⓘ &nbsp; About ATLAS</button><div class="drawer-foot">ATLAS Sprint 3<br>Chubby Gorilla internal warehouse tool</div></aside></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/app.js" defer></script>
</body>
</html>
