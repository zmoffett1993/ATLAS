<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071b34">
<meta name="description" content="ATLAS warehouse SKU finder for Chubby Gorilla.">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ATLAS · Warehouse SKU Finder</title>
<style>
:root{
  --brand-navy:#071b34;--brand-navy-2:#0b2948;--atlas-blue:#0d47a1;--atlas-blue-2:#125bd4;
  --workspace:#f7f8fa;--surface:#ffffff;--nav:#eef1f5;--ink:#0f172a;--muted:#5f6b7a;
  --line:#e2e7ed;--lane:#4b5563;--danger:#b42318;--success:#16794b;
  --radius:18px;--shadow:0 8px 24px rgba(15,23,42,.08);--shadow-soft:0 3px 12px rgba(15,23,42,.07);
}
*{box-sizing:border-box}html{background:var(--workspace);scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--workspace)}button,input{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;padding-bottom:84px}.screen{max-width:760px;margin:0 auto}
.brand-header{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(7,27,52,.99),rgba(8,37,68,.96));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 34px;border-radius:0 0 28px 28px}
.brand-header:before{content:"";position:absolute;inset:0;opacity:.38;background-image:radial-gradient(circle at 12% 20%,rgba(255,255,255,.8) 0 1px,transparent 1.5px),radial-gradient(circle at 73% 18%,rgba(73,151,255,.8) 0 1px,transparent 1.5px),radial-gradient(circle at 86% 67%,rgba(255,255,255,.65) 0 1px,transparent 1.4px),radial-gradient(circle at 28% 72%,rgba(61,129,220,.65) 0 1px,transparent 1.4px);background-size:88px 88px,124px 124px,156px 156px,190px 190px}
.brand-inner{position:relative;z-index:1}.brand-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.menu-button{width:44px;height:44px;border:0;border-radius:13px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}.menu-button span,.menu-button span:before,.menu-button span:after{content:"";display:block;width:20px;height:2px;background:currentColor;border-radius:2px}.menu-button span:before{transform:translateY(-6px)}.menu-button span:after{transform:translateY(4px)}
.cg-lockup{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.5px}.gorilla-mark{width:43px;height:43px;border-radius:13px;background:#fff;color:var(--brand-navy);display:grid;place-items:center;font-weight:1000;font-size:12px}.cg-name{line-height:.88;font-size:15px;text-align:left}.connection{font-size:10px;font-weight:900;letter-spacing:.8px;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.1);color:#dbe9f7}.connection.live{background:rgba(61,197,125,.18);color:#b9f3d3}.connection.error{background:rgba(255,92,92,.16);color:#ffd0d0}
.brand-title{text-align:center;margin-top:20px}.brand-title h1{margin:0;font-size:44px;letter-spacing:3px;line-height:1;font-weight:900}.brand-title p{margin:6px 0 0;font-size:12px;font-weight:800;letter-spacing:1.2px}.brand-title .tagline{margin-top:12px;color:#4d91ff;font-size:16px;letter-spacing:0;font-weight:700}
.workspace{padding:18px 16px 26px}.search-panel{position:relative;margin-top:-40px;background:rgba(255,255,255,.96);border:1px solid rgba(226,231,237,.9);border-radius:20px;padding:14px;box-shadow:var(--shadow)}.search-wrap{position:relative}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#536174}.search{width:100%;border:1px solid #dfe5ec;background:#fff;border-radius:14px;padding:15px 46px 15px 46px;outline:none;font-size:16px;box-shadow:var(--shadow-soft)}.search:focus{border-color:var(--atlas-blue);box-shadow:0 0 0 3px rgba(13,71,161,.12)}.clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:#edf1f5;color:#334155;display:none;cursor:pointer;font-size:20px}.suggestions{position:absolute;z-index:20;left:0;right:0;top:58px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:320px;overflow:auto;display:none}.suggestion{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:850}.suggestion:last-child{border-bottom:0}.suggestion small{display:block;margin-top:3px;color:var(--muted);font-weight:500}.suggestion:hover,.suggestion:focus{background:#f2f6fb;outline:none}
.quick-link{width:100%;margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;box-shadow:var(--shadow-soft)}.quick-icon{width:42px;height:42px;border-radius:12px;background:#eef4ff;color:var(--atlas-blue);display:grid;place-items:center;font-size:22px;font-weight:900}.quick-copy{flex:1}.quick-copy strong{display:block;font-size:15px}.quick-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.chevron{font-size:24px;color:#415066}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}.section-heading h2{font-size:14px;margin:0;letter-spacing:.4px}.link-button{border:0;background:transparent;color:var(--atlas-blue);font-size:12px;font-weight:850;cursor:pointer}
.recent-list{display:grid;gap:8px}.recent-item{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;box-shadow:var(--shadow-soft)}.recent-clock{width:27px;height:27px;border:2px solid #6d7a8a;border-radius:50%;position:relative;flex:0 0 auto}.recent-clock:before{content:"";position:absolute;width:2px;height:7px;background:#6d7a8a;left:11px;top:4px}.recent-clock:after{content:"";position:absolute;width:6px;height:2px;background:#6d7a8a;left:11px;top:11px;transform:rotate(25deg);transform-origin:left center}.recent-copy{min-width:0;flex:1}.recent-copy strong{display:block;font-size:13px;word-break:break-word}.recent-copy span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.empty{background:#fff;border:1px dashed #cfd7e1;border-radius:var(--radius);padding:30px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow-soft)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.not-found strong{color:var(--danger)}
.result-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.result-top{padding:15px 17px;background:var(--brand-navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.result-top strong{font-size:14px;letter-spacing:.4px}.result-top span{font-size:11px;font-weight:800}.result-body{padding:18px}.sku-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.sku-copy{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--ink)}.sku-copy .sku{font-size:20px;font-weight:950;word-break:break-word}.sku-copy small{display:block;color:var(--muted);margin-top:5px}.location-list{display:grid;gap:10px;margin-top:18px}.location-button{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.location-badge{min-width:52px;height:52px;border-radius:11px;background:linear-gradient(145deg,var(--atlas-blue-2),var(--atlas-blue));color:#fff;display:grid;place-items:center;font-size:20px;font-weight:950}.location-detail{flex:1;min-width:0}.location-detail strong{display:block;font-size:14px}.location-detail span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.map-panel{margin-top:18px;border-top:1px solid var(--line);padding-top:17px}.map-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.map-title strong{font-size:14px}.map-title span{font-size:11px;color:var(--muted)}.aisle-map{display:grid;grid-template-columns:1fr 54px;gap:12px}.map-stack{display:grid;gap:7px}.map-section,.drive-lane{min-height:54px;border-radius:10px;display:grid;place-items:center;font-weight:900}.map-section{border:1px solid #dfe5ec;background:#fff;font-size:20px}.map-section.active{background:linear-gradient(145deg,var(--atlas-blue-2),var(--atlas-blue));color:#fff;border-color:var(--atlas-blue);box-shadow:0 8px 18px rgba(13,71,161,.22)}.drive-lane{min-height:34px;background:var(--lane);color:#fff;font-size:10px}.drive-lane.main{background:var(--brand-navy)}.orientation{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-size:10px;font-weight:850;padding:2px 0}.orientation-line{flex:1;width:2px;background:#27364b;position:relative;margin:8px 0}.orientation-line:before,.orientation-line:after{content:"";position:absolute;left:50%;width:8px;height:8px;border-left:2px solid #27364b;border-top:2px solid #27364b}.orientation-line:before{top:0;transform:translate(-50%,0) rotate(45deg)}.orientation-line:after{bottom:0;transform:translate(-50%,0) rotate(225deg)}
.page-title{margin:4px 0 4px;font-size:23px}.page-subtitle{margin:0 0 18px;color:var(--muted);font-size:13px}.aisle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.aisle-tile{min-height:60px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:var(--shadow-soft)}.aisle-tile.active{background:linear-gradient(145deg,var(--atlas-blue-2),var(--atlas-blue));color:#fff;border-color:var(--atlas-blue)}.aisle-browser{margin-top:18px}.aisle-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.aisle-card-title{padding:14px 16px;background:var(--brand-navy);color:#fff;display:flex;justify-content:space-between;font-weight:900}.section{padding:13px 15px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.section-loc{font-weight:900}.section-count{font-size:11px;color:var(--muted)}.sku-chip{display:block;width:100%;border:0;background:#f4f6f9;border-radius:9px;padding:9px 10px;margin-top:6px;text-align:left;font-size:12px;font-weight:750;cursor:pointer;word-break:break-word}
.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(238,241,245,.96);backdrop-filter:blur(16px);border-top:1px solid #d9e0e8;padding:8px 16px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(15,23,42,.07)}.bottom-nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}.nav-button{border:0;background:transparent;color:#4b5563;padding:6px;display:grid;place-items:center;gap:2px;font-size:11px;font-weight:800;cursor:pointer}.nav-button .nav-icon{font-size:23px}.nav-button.active{color:var(--atlas-blue)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(3,12,24,.5);z-index:50;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(88vw,360px);background:linear-gradient(155deg,var(--brand-navy),#061426);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 20px;transform:translateX(100%);transition:.25s}.drawer-backdrop.open .drawer{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12)}.drawer-close{border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}.drawer-link{width:100%;border:0;background:transparent;color:#fff;padding:17px 2px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;font-size:16px;cursor:pointer}.drawer-foot{position:absolute;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;color:#b5c4d5;font-size:12px}.toast{position:fixed;z-index:70;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#111827;color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.workspace{padding-left:22px;padding-right:22px}.brand-title h1{font-size:50px}.aisle-grid{grid-template-columns:repeat(7,1fr)}.result-body{padding:22px}.aisle-map{grid-template-columns:minmax(280px,1fr) 68px}}
</style>
</head>
<body>
<div class="app">
  <div class="screen">
    <header class="brand-header">
      <div class="brand-inner">
        <div class="brand-top">
          <button id="menuButton" class="menu-button" type="button" aria-label="Open menu"><span></span></button>
          <div class="cg-lockup"><div class="gorilla-mark">CG</div><div class="cg-name">CHUBBY<br>GORILLA®</div></div>
          <div id="connectionStatus" class="connection">CONNECTING</div>
        </div>
        <div class="brand-title"><h1>ATLAS</h1><p>WAREHOUSE SKU FINDER</p><div class="tagline">Find any SKU in seconds.</div></div>
      </div>
    </header>

    <main class="workspace">
      <section id="homeView">
        <div class="search-panel">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input id="search" class="search" autocomplete="off" placeholder="Search SKU or scan barcode..." aria-label="Search SKU">
            <button id="clear" class="clear" type="button" aria-label="Clear search">×</button>
            <div id="suggestions" class="suggestions" role="listbox"></div>
          </div>
          <button id="browseShortcut" class="quick-link" type="button"><span class="quick-icon">▦</span><span class="quick-copy"><strong>Browse Aisles</strong><span>View warehouse layout by aisle.</span></span><span class="chevron">›</span></button>
        </div>

        <section id="resultsArea" class="hidden" style="margin-top:18px"><div id="results"></div></section>
        <section id="emptyArea" class="hidden" style="margin-top:18px"><div id="emptyState" class="empty"></div></section>

        <section id="recentsSection" class="hidden">
          <div class="section-heading"><h2>RECENT SEARCHES</h2><button id="clearRecents" class="link-button" type="button">Clear Recents</button></div>
          <div id="recentList" class="recent-list"></div>
        </section>
      </section>

      <section id="aisleView" class="hidden">
        <h2 class="page-title">BROWSE AISLES</h2><p class="page-subtitle">Select an aisle to view its warehouse layout.</p>
        <div id="aisleGrid" class="aisle-grid"></div><div id="aisles" class="aisle-browser"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Primary navigation"><div class="bottom-nav-inner">
    <button class="nav-button active" type="button" data-view="homeView"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="nav-button" type="button" data-view="aisleView"><span class="nav-icon">▦</span><span>Browse Aisles</span></button>
  </div></nav>

  <div id="drawerBackdrop" class="drawer-backdrop"><aside class="drawer" aria-label="Application menu"><div class="drawer-head"><div class="cg-lockup"><div class="gorilla-mark">CG</div><div class="cg-name">CHUBBY<br>GORILLA®</div></div><button id="drawerClose" class="drawer-close" type="button" aria-label="Close menu">×</button></div><button class="drawer-link" type="button" data-drawer-view="homeView">⌂ &nbsp; Home</button><button class="drawer-link" type="button" data-drawer-view="aisleView">▦ &nbsp; Browse Aisles</button><button class="drawer-link" type="button" id="aboutButton">ⓘ &nbsp; About ATLAS</button><div class="drawer-foot">ATLAS Version 1.0<br>Live production inventory</div></aside></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://dwrrbpiprcmajfyronlf.supabase.co';
const SUPABASE_KEY='sb_publishable_akr0opK3RV0Mg5CQpF2woQ_hBFyRIJa';
const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
let skuData=[],locationRows=[],recentSkus=[];let toastTimer;
const $=id=>document.getElementById(id);const search=$('search'),clearBtn=$('clear'),suggestions=$('suggestions'),results=$('results'),emptyState=$('emptyState');
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const normalize=v=>String(v??'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9-]/g,'');
function strictSkuMatch(sku,query){const source=normalize(sku),q=normalize(query);if(!q)return false;return q.split('-').filter(Boolean).every(part=>source.includes(part));}
async function fetchAll(table,select='*'){const pageSize=1000;let offset=0,all=[];while(true){const url=`${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(select)}&order=created_at.asc&limit=${pageSize}&offset=${offset}`;const response=await fetch(url,{headers});if(!response.ok)throw new Error(`${table}: ${response.status}`);const page=await response.json();all=all.concat(page);if(page.length<pageSize)return all;offset+=pageSize;}}
function saveRecents(){localStorage.setItem('atlas-recent-skus',JSON.stringify(recentSkus));}
function loadRecents(){try{const stored=JSON.parse(localStorage.getItem('atlas-recent-skus')||'[]');recentSkus=Array.isArray(stored)?stored.slice(0,5):[];}catch{recentSkus=[];}}
function addRecent(sku){recentSkus=[sku,...recentSkus.filter(item=>item!==sku)].slice(0,5);saveRecents();renderRecents();}
function renderRecents(){const section=$('recentsSection'),list=$('recentList');if(!recentSkus.length){section.classList.add('hidden');list.innerHTML='';return;}section.classList.remove('hidden');list.innerHTML=recentSkus.map((sku,index)=>`<button class="recent-item" type="button" data-sku="${escapeHtml(sku)}"><span class="recent-clock"></span><span class="recent-copy"><strong>${escapeHtml(sku)}</strong><span>${index===0?'Most recent':'Recent search'}</span></span><span class="chevron">›</span></button>`).join('');list.querySelectorAll('[data-sku]').forEach(btn=>btn.addEventListener('click',()=>selectSku(btn.dataset.sku)));}
async function loadData(){try{const [skus,locations]=await Promise.all([fetchAll('skus'),fetchAll('locations')]);const skuById=new Map(skus.filter(s=>s.active!==false).map(s=>[s.id,s]));locationRows=locations.filter(l=>skuById.has(l.sku_id)).map(l=>({...l,sku:skuById.get(l.sku_id).sku}));skuData=[...skuById.values()].map(s=>({id:s.id,sku:s.sku,description:s.description||'',locations:locationRows.filter(l=>l.sku_id===s.id).sort((a,b)=>Number(a.aisle)-Number(b.aisle)||String(a.section).localeCompare(String(b.section)))})).sort((a,b)=>a.sku.localeCompare(b.sku));$('connectionStatus').textContent='LIVE';$('connectionStatus').className='connection live';renderAisles();}catch(error){console.error(error);$('connectionStatus').textContent='OFFLINE';$('connectionStatus').className='connection error';showEmpty('Could not load warehouse data',error.message,true);}}
function showSuggestions(query){if(!normalize(query)){suggestions.style.display='none';return;}const matches=skuData.filter(item=>strictSkuMatch(item.sku,query)).slice(0,12);suggestions.innerHTML=matches.map(item=>`<div class="suggestion" tabindex="0" data-sku="${escapeHtml(item.sku)}">${escapeHtml(item.sku)}<small>${item.locations.length} location${item.locations.length===1?'':'s'}${item.locations[0]?` · ${escapeHtml(locationLabel(item.locations[0]))}`:''}</small></div>`).join('');suggestions.style.display=matches.length?'block':'none';suggestions.querySelectorAll('.suggestion').forEach(el=>{el.addEventListener('click',()=>selectSku(el.dataset.sku));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectSku(el.dataset.sku);}});});}
function isBackWall(section){return ['BACK WALL STORAGE','BACK WALL','BWS','REAR WALL STORAGE','REAR WALL','RWS'].includes(String(section??'').toUpperCase());}
function locationLabel(loc){return isBackWall(loc.section)?'BACK':`${loc.aisle}${loc.section}`;}
function locationTitle(loc){return isBackWall(loc.section)?`Aisle ${loc.aisle} · Back Wall Storage`:`Aisle ${loc.aisle} · Section ${loc.section}`;}
function buildMap(loc){if(isBackWall(loc.section))return '';const active=String(loc.section||'').toUpperCase();return `<div class="map-panel"><div class="map-title"><strong>Aisle ${escapeHtml(loc.aisle)} warehouse layout</strong><span>Selected: ${escapeHtml(active)}</span></div><div class="aisle-map"><div class="map-stack"><div class="map-section ${active==='A'?'active':''}">A</div><div class="drive-lane main">MAIN FORKLIFT DRIVEWAY</div><div class="map-section ${active==='B'?'active':''}">B</div><div class="drive-lane">FORKLIFT DRIVEWAY 2</div><div class="map-section ${active==='C'?'active':''}">C</div><div class="drive-lane">FORKLIFT DRIVEWAY 3</div><div class="map-section ${active==='D'?'active':''}">D</div></div><div class="orientation"><span>Front<br>of Aisle</span><span class="orientation-line"></span><span>Back<br>of Aisle</span></div></div></div>`;}
function showToast(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1200);}
async function copySku(sku){try{await navigator.clipboard.writeText(sku);}catch{const area=document.createElement('textarea');area.value=sku;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();}showToast('✓ SKU copied');}
function showEmpty(title,message,isError=false){$('resultsArea').classList.add('hidden');$('emptyArea').classList.remove('hidden');emptyState.className=`empty${isError?' not-found':''}`;emptyState.innerHTML=`<strong>${escapeHtml(title)}</strong><div>${escapeHtml(message)}</div>`;}
function clearOutput(){$('resultsArea').classList.add('hidden');$('emptyArea').classList.add('hidden');results.innerHTML='';}
function renderResult(item){$('emptyArea').classList.add('hidden');$('resultsArea').classList.remove('hidden');if(!item.locations.length){results.innerHTML=`<article class="result-card"><div class="result-top"><strong>SEARCH RESULTS</strong><span>0 LOCATIONS FOUND</span></div><div class="result-body"><button class="sku-copy" type="button" data-copy-sku="${escapeHtml(item.sku)}"><span class="sku">${escapeHtml(item.sku)}</span><small>Tap SKU to copy</small></button><div class="empty not-found" style="margin-top:18px"><strong>No location assigned</strong><div>This SKU exists but needs a warehouse location.</div></div></div></article>`;bindCopy();return;}const [primary,...overflow]=item.locations;const all=[primary,...overflow];results.innerHTML=`<article class="result-card"><div class="result-top"><strong>SEARCH RESULTS</strong><span>${all.length} LOCATION${all.length===1?'':'S'} FOUND</span></div><div class="result-body"><div class="sku-row"><button class="sku-copy" type="button" data-copy-sku="${escapeHtml(item.sku)}"><span class="sku">${escapeHtml(item.sku)}</span><small>All levels (A1 – A4) · Tap to copy</small></button></div><div class="location-list">${all.map((loc,index)=>`<button class="location-button" type="button"><span class="location-badge">${escapeHtml(locationLabel(loc))}</span><span class="location-detail"><strong>${escapeHtml(locationTitle(loc))} · ${index===0?'Primary':'Additional'} Location</strong><span>${escapeHtml(loc.level_info||'All Levels')}${loc.notes?` · ${escapeHtml(loc.notes)}`:''}</span></span><span class="chevron">›</span></button>`).join('')}</div>${buildMap(primary)}</div></article>`;bindCopy();}
function bindCopy(){results.querySelectorAll('[data-copy-sku]').forEach(btn=>btn.addEventListener('click',()=>copySku(btn.dataset.copySku)));}
function selectSku(sku){const item=skuData.find(x=>x.sku===sku);if(!item)return;showView('homeView');search.value=sku;clearBtn.style.display='block';suggestions.style.display='none';renderResult(item);addRecent(item.sku);search.blur();window.scrollTo({top:0,behavior:'smooth'});}
function runSearch(){const q=search.value;clearBtn.style.display=q?'block':'none';showSuggestions(q);const exact=skuData.find(item=>normalize(item.sku)===normalize(q));if(exact)renderResult(exact);else if(!q)clearOutput();else clearOutput();}
function renderAisles(){const aisleNumbers=[...new Set(locationRows.map(l=>Number(l.aisle)))].filter(Number.isFinite).sort((a,b)=>a-b);const grid=$('aisleGrid');if(!aisleNumbers.length){grid.innerHTML='<div class="empty">No aisles loaded.</div>';return;}grid.innerHTML=aisleNumbers.map((aisle,index)=>`<button class="aisle-tile ${index===0?'active':''}" type="button" data-aisle="${aisle}">${aisle}</button>`).join('');const showAisle=aisle=>{grid.querySelectorAll('.aisle-tile').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.aisle)===aisle));const bySection={A:[],B:[],C:[],D:[]};locationRows.filter(l=>Number(l.aisle)===aisle).forEach(l=>{const section=String(l.section||'').toUpperCase();if(bySection[section])bySection[section].push(l);});$('aisles').innerHTML=`<div class="aisle-card"><div class="aisle-card-title"><span>AISLE ${aisle}</span><span>WAREHOUSE LAYOUT</span></div>${['A','B','C','D'].map(section=>{const rows=bySection[section].sort((a,b)=>a.sku.localeCompare(b.sku));return `<div class="section"><div class="section-head"><span class="section-loc">Section ${section}</span><span class="section-count">${rows.length} SKU${rows.length===1?'':'s'}</span></div>${rows.length?rows.map(row=>`<button class="sku-chip" type="button" data-sku="${escapeHtml(row.sku)}">${escapeHtml(row.sku)}</button>`).join(''):'<div style="color:var(--muted);font-size:12px">No SKUs assigned</div>'}</div>`;}).join('')}</div>`;$('aisles').querySelectorAll('[data-sku]').forEach(btn=>btn.addEventListener('click',()=>selectSku(btn.dataset.sku)));};grid.querySelectorAll('.aisle-tile').forEach(btn=>btn.addEventListener('click',()=>showAisle(Number(btn.dataset.aisle))));showAisle(aisleNumbers[0]);}
function showView(viewId){document.querySelectorAll('main>section').forEach(section=>section.classList.toggle('hidden',section.id!==viewId));document.querySelectorAll('.nav-button').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===viewId));suggestions.style.display='none';search.blur();}
search.addEventListener('input',runSearch);search.addEventListener('focus',()=>{if(search.value)showSuggestions(search.value);});search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const exact=skuData.find(item=>normalize(item.sku)===normalize(search.value));const first=exact||skuData.find(item=>strictSkuMatch(item.sku,search.value));if(first)selectSku(first.sku);else if(search.value.trim()){showEmpty('SKU not found',`No match for “${search.value.trim()}”.`,true);suggestions.style.display='none';search.blur();}}});
clearBtn.addEventListener('mousedown',e=>e.preventDefault());clearBtn.addEventListener('click',()=>{search.value='';clearBtn.style.display='none';suggestions.style.display='none';clearOutput();search.blur();});
$('clearRecents').addEventListener('click',()=>{recentSkus=[];saveRecents();renderRecents();showToast('Recents cleared');});
$('browseShortcut').addEventListener('click',()=>showView('aisleView'));document.querySelectorAll('.nav-button').forEach(btn=>btn.addEventListener('click',()=>showView(btn.dataset.view)));
const backdrop=$('drawerBackdrop');$('menuButton').addEventListener('click',()=>backdrop.classList.add('open'));$('drawerClose').addEventListener('click',()=>backdrop.classList.remove('open'));backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.classList.remove('open');});document.querySelectorAll('[data-drawer-view]').forEach(btn=>btn.addEventListener('click',()=>{showView(btn.dataset.drawerView);backdrop.classList.remove('open');}));$('aboutButton').addEventListener('click',()=>{backdrop.classList.remove('open');showToast('ATLAS · Warehouse SKU Finder');});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestions.style.display='none';});
loadRecents();renderRecents();loadData();
</script>
</body>
</html>
