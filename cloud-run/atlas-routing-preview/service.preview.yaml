# Review template, not a live deployment. Replace image with the built digest.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: atlas-routing-preview
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/maxScale: '1'
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'false'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: atlas-routing-preview@project-6a63ee65-40cb-4d53-b32.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 60
      containers:
        - image: REPLACE_WITH_REVIEWED_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          env:
            - name: ATLAS_ROUTING_PREVIEW_ENABLED
              value: 'false'
            - name: ATLAS_ROUTING_TESTER_IDS
              value: ''
            - name: ATLAS_ROUTING_SUPABASE_PUBLISHABLE_KEY
              value: ''
            - name: ATLAS_ROUTING_CA_DEPOT_JSON
              value: ''
